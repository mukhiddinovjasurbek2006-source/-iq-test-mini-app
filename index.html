<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>IQ Test Uzbekistan</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    linear-gradient(135deg,#0f172a,#172554,#312e81);
  color:white;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:20px 15px 40px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
  font-size:55px;
  text-align:center;
  margin-top:20px;
}

h1{
  text-align:center;
  margin:10px 0 8px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  opacity:.75;
  margin-bottom:25px;
}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:rgba(255,255,255,.1);
}

.question-number{
  opacity:.7;
  font-size:14px;
  margin-bottom:10px;
}

.question{
  font-size:22px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:20px;
}

.answer{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  padding:15px;
  margin:10px 0;
  cursor:pointer;
  transition:.2s;
}

.answer.selected{
  background:#6366f1;
  border-color:#a78bfa;
}

.answer.correct{
  background:#16a34a;
}

.answer.wrong{
  background:#dc2626;
}

.timer{
  text-align:center;
  font-size:20px;
  font-weight:800;
  margin-bottom:18px;
}

.progress{
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#8b5cf6,#06b6d4);
  transition:.3s;
}

.iq{
  font-size:70px;
  font-weight:900;
  text-align:center;
  margin:10px 0;
  background:linear-gradient(90deg,#fbbf24,#f97316,#ec4899);
  -webkit-background-clip:text;
  color:transparent;
}

.emotion{
  text-align:center;
  font-size:23px;
  font-weight:800;
  margin:15px 0;
}

.score{
  text-align:center;
  opacity:.8;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:rgba(255,255,255,.08);
  border-radius:17px;
  padding:17px;
  text-align:center;
}

.stat-title{
  font-size:13px;
  opacity:.65;
}

.stat-value{
  font-size:25px;
  font-weight:800;
  margin-top:5px;
}

.rank-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:8px 0;
  background:rgba(255,255,255,.06);
  border-radius:14px;
}

.rank-number{
  width:35px;
  font-weight:900;
  text-align:center;
}

.rank-name{
  flex:1;
}

.rank-iq{
  font-weight:900;
}

.my-rank{
  background:rgba(99,102,241,.35);
  border:1px solid #818cf8;
}

.profile-name{
  text-align:center;
  font-size:25px;
  font-weight:800;
}

.history{
  margin-top:15px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.small{
  font-size:13px;
  opacity:.65;
}

.music-status{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  opacity:.7;
}

.confetti{
  position:fixed;
  top:-10px;
  width:8px;
  height:15px;
  animation:fall 3s linear forwards;
  z-index:9999;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

.loading{
  text-align:center;
  padding:20px;
  opacity:.7;
}

</style>

</head>

<body>

<div class="container">

<!-- ================= HOME ================= -->

<div id="home" class="screen active">

  <div class="card">

    <div class="logo">🧠</div>

    <h1>IQ TEST</h1>

    <div class="subtitle">
      O'z IQ darajangizni sinab ko'ring
    </div>

    <button onclick="startTest()">
      🚀 TESTNI BOSHLASH
    </button>

    <button class="secondary" onclick="showRanking()">
      🏆 TOP 100
    </button>

    <button class="secondary" onclick="showProfile()">
      👤 PROFILIM
    </button>

  </div>

</div>


<!-- ================= TEST ================= -->

<div id="test" class="screen">

  <div class="card">

    <div class="timer" id="timer">

    </div>

    <div class="progress">
      <div

    </div>

      id="questionNumber">
    </div>

      id="question">
    </div>

    <div id="answers"></div>

    <button onclick="nextQuestion()">
      KEYINGI →
    </button>

  </div>

</div>


<!-- ================= RESULT ================= -->

<div id="result" class="screen">

  <div class="card">

    <div class="logo">🧠</div>

    <div
      class="emotion"
      id="emotion">
    </div>

    <div class="iq" id="iqValue">
      0
    </div>

    <div class="score" id="scoreValue">
      0 / 0
    </div>

    <div class="stat-grid">

      <div class="stat">

        <div class="stat-title">
          SIZNING IQ
        </div>

        <div
          class="stat-value"

          -
        </div>

      </div>

      <div class="stat">

        <div class="stat-title">
          RANK
        </div>

        <div
          class="stat-value"
          id="resultRank">
          -
        </div>

      </div>

      <div class="stat">

        <div class="stat-title">
          STREAK
        </div>

        <div
          class="stat-value"
          id="resultStreak">
          -
        </div>

      </div>

      <div class="stat">

        <div class="stat-title">
          HOLATI
        </div>

        <div
          class="stat-value">
          ✓
        </div>

      </div>

    </div>


    <button onclick="toggleMusic()">
      🔊 MUSIQANI YOQISH / O'CHIRISH
    </button>

    <div
      class="music-status"
      id="musicStatus">
      🎵 Natija musiqasi
    </div>


    <button onclick="showRanking()">
      🏆 RANKINGNI KO'RISH
    </button>

    <button onclick="showProfile()">
      👤 PROFILIM
    </button>

    <button
      class="secondary"
      onclick="goHome()">
      🏠 BOSH SAHIFA
    </button>

  </div>

</div>


<!-- ================= RANKING ================= -->

<div id="ranking" class="screen">

  <div class="card">

    <h1>🏆 TOP 100</h1>

    <div
      id="rankingList"
      class="loading">
      Yuklanmoqda...
    </div>

    <button onclick="goHome()">
      🏠 BOSH SAHIFA
    </button>

  </div>

</div>


<!-- ================= PROFILE ================= -->

<div id="profile" class="screen">

  <div class="card">

    <div
      class="profile-name"

    <div class="stat-grid">

        </div>

          -
        </div>

          TESTLAR
        </div>

          -
        </div>

      </div>

        <div class="stat-title">
          RANK
        </div>

          id="profileRank">
          -
        </div>

      </div>

        <div class="stat-title">
          🔥 STREAK
        </div>

          class="stat-value"
          id="profileStreak">
          -
        </div>

    </div>

        📊 So'nggi natijalar
      </h3>

      <div
        id="historyList">
      </div>

    </div>


    <button onclick="goHome()">
      🏠 BOSH SAHIFA
    </button>

  </div>

</div>

</div>

/* ==================================================
   TEST VARIABLES
================================================== */

let questions = [];

let current = 0;

let selected = null;

let score = 0;

let maxScore = 0;

let timerSeconds = 600;

let timerInterval = null;

let startTime = 0;

let lastIQ = 0;


/* ==================================================
   MUSIC
================================================== */

let audio = null;

let musicOn = false;


function createAudio(){

  if(!audio){

    audio =
      new Audio("FUNK_VICTORY_CYTRENA_#bass_#bassboosted_#funk_#music_#phon.mp3");

    audio.loop = true;

    audio.volume = 0.7;

  }

}


function playVictoryMusic(){

  createAudio();

  audio.currentTime = 0;

  const playPromise =
    audio.play();

  if(playPromise){

    playPromise
      .then(()=>{

        musicOn = true;

        updateMusicStatus();

      })
      .catch(()=>{

        musicOn = false;

        updateMusicStatus();

        console.log(
          "Avtomatik musiqa ijrosi Telegram/iPhone tomonidan bloklandi."
        );

      });

  }

}


function toggleMusic(){

  createAudio();

  if(musicOn){

    audio.pause();

    musicOn = false;

  }else{

    audio.play()
      .then(()=>{

        musicOn = true;

        updateMusicStatus();

      })
      .catch(()=>{

        alert(
          "🔊 Musiqani yoqish uchun yana bosing."
        );

      });

  }

  updateMusicStatus();

}


function updateMusicStatus(){

  const el =
    document.getElementById(
      "musicStatus"
    );

  if(!el) return;

  el.textContent =
    musicOn
      ? "🎵 Musiqa ijro etilmoqda"
      : "🔇 Musiqa o‘chiq";

}


/* ==================================================
   SCREEN
================================================== */

function showOnly(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{

      screen.classList.remove(
        "active"
      );

    });

  document
    .getElementById(id)
    .classList.add("active");

}


/* ==================================================
   HOME
================================================== */

function goHome(){

  clearInterval(timerInterval);

  showOnly("home");

}


/* ==================================================
   START TEST
================================================== */

function startTest(){

  clearInterval(timerInterval);

  questions =
    [...questionsBank]
      .sort(
        ()=>Math.random()-0.5
      )
      .slice(0,20);

  current = 0;

  selected = null;

  score = 0;

  maxScore = 0;

  questions.forEach(q=>{

    maxScore += q.d;

  });

  timerSeconds = 600;

  startTime = Date.now();

  showOnly("test");

  renderQuestion();

  startTimer();

}


/* ==================================================
   TIMER
================================================== */

function startTimer(){

  updateTimer();

  timerInterval =
    setInterval(()=>{

      timerSeconds--;

      updateTimer();

      if(timerSeconds <= 0){

        clearInterval(
          timerInterval
        );

        finishTest();

      }

    },1000);

}


function updateTimer(){

  const minutes =
    Math.floor(
      timerSeconds/60
    );

  const seconds =
    timerSeconds%60;

  document.getElementById(
    "timer"
  ).textContent =
    `⏱ ${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}


/* ==================================================
   RENDER QUESTION
================================================== */

function renderQuestion(){

  selected = null;

  const q =
    questions[current];

  document.getElementById(
    "questionNumber"
  ).textContent =
    `Savol ${current+1} / ${questions.length}`;

  document.getElementById(
    "question"
  ).textContent =
    q.q;

  const answers =
    document.getElementById(
      "answers"
    );

  answers.innerHTML = "";

  q.a.forEach(
    (answer,index)=>{

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "answer";

      div.textContent =
        answer;

      div.onclick =
        ()=>selectAnswer(
          index
        );

      answers.appendChild(div);

    }
  );

  const percent =
    ((current) /
      questions.length) *
    100;

  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";

}


/* ==================================================
   SELECT ANSWER
================================================== */

function selectAnswer(index){

  selected = index;

  document
    .querySelectorAll(
      ".answer"
    )
    .forEach(
      (el,i)=>{

        el.classList.toggle(
          "selected",
          i === index
        );

      }
    );

}


/* ==================================================
   NEXT
================================================== */

function nextQuestion(){

  if(selected === null){

    alert(
      "Avval javobni tanlang."
    );

    return;

  }

  const q =
    questions[current];

  if(
    selected === q.c
  ){

    score += q.d;

  }

  if(
    current <
    questions.length-1
  ){

    current++;

    renderQuestion();

  }else{

    finishTest();

  }

}


/* ==================================================
   FINISH TEST
================================================== */

async function finishTest(){

  clearInterval(
    timerInterval
  );


  const percentage =
    score / maxScore;


  /*
    Hozircha demo IQ formulasi.
    Keyinchalik real normativ scoring
    qo'yish mumkin.
  */

  lastIQ =
    Math.round(
      70 +
      percentage * 60
    );


  document.getElementById(
    "iqValue"
  ).textContent =
    lastIQ;


  document.getElementById(
    "resultIQ"
  ).textContent =
    lastIQ;


  document.getElementById(
    "scoreValue"
  ).textContent =
    `${score} / ${maxScore}`;


  setEmotion(lastIQ);


  showOnly("result");


  /*
    🎵 TEST TUGASHI BILAN
    NATIJA MUSIQASI
  */

  playVictoryMusic();


  /*
    Natijani Supabase'ga
    avtomatik saqlaymiz
  */

  await saveResult();

}

/* ==================================================
   SUPABASE REQUEST
================================================== */

async function supabaseFetch(
  endpoint,
  options={}
){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${endpoint}`,
      {

        ...options,

        headers:{
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );

  return response;

}


/* ==================================================
   SAVE RESULT
================================================== */

async function saveResult(){

  try{

    const response =
      await supabaseFetch(
        "results",
        {

          method:"POST",

          headers:{
            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify({

              telegram_id:
                telegramId,

              username:
                username,

              first_name:
                firstName,

              score:
                score,

              iq:
                lastIQ

            })

        }
      );


    if(!response.ok){

      console.log(
        "Natijani saqlash xatosi:",
        await response.text()
      );

      return;

    }


    await updateResultStats();

  }catch(error){

    console.log(
      "Supabase error:",
      error
    );

  }

}


/* ==================================================
   RESULT STATS
================================================== */

async function updateResultStats(){

  try{

    const response =
      await supabaseFetch(
        `results?select=telegram_id,iq,created_at&telegram_id=eq.${telegramId}&order=created_at.desc`
      );


    if(!response.ok)
      return;


    const data =
      await response.json();


    const rank =
      await getUserRank();


    const streak =
      calculateStreak(
        data
      );


    document.getElementById(
      "resultRank"
    ).textContent =
      rank
        ? `#${rank}`
        : "-";


    document.getElementById(
      "resultStreak"
    ).textContent =
      `🔥 ${streak}`;

  }catch(error){

    console.log(error);

  }

}


/* ==================================================
   GET RANK
================================================== */

async function getUserRank(){

  try{

    const response =
      await supabaseFetch(
        "results?select=telegram_id,iq"
      );


    if(!response.ok)
      return null;


    const data =
      await response.json();


    const bestMap = {};


    data.forEach(row=>{

      if(
        !bestMap[row.telegram_id] ||
        row.iq >
        bestMap[row.telegram_id]
      ){

        bestMap[row.telegram_id] =
          row.iq;

      }

    });


    const sorted =
      Object.entries(
        bestMap
      )
      .sort(
        (a,b)=>b[1]-a[1]
      );


    const index =
      sorted.findIndex(
        x =>
          String(x[0]) ===
          String(telegramId)
      );


    return index >= 0
      ? index+1
      : null;

  }catch(error){

    return null;

  }

}


/* ==================================================
   STREAK
================================================== */

function calculateStreak(data){

  if(!data || !data.length)
    return 0;


  const dates =
    [
      ...new Set(
        data.map(
          row =>
            new Date(
              row.created_at
            ).toLocaleDateString(
              "en-CA"
            )
        )
      )
    ]
    .sort()
    .reverse();


  if(!dates.length)
    return 0;


  let streak = 0;


  const today =
    new Date();


  let checkDate =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


  const todayString =
    checkDate.toLocaleDateString(
      "en-CA"
    );


  if(
    dates[0] !==
    todayString
  ){

    checkDate.setDate(
      checkDate.getDate()-1
    );

  }


  for(
    const date of dates
  ){

    const expected =
      checkDate.toLocaleDateString(
        "en-CA"
      );


    if(
      date === expected
    ){

      streak++;

      checkDate.setDate(
        checkDate.getDate()-1
      );

    }else{

      break;

    }

  }


  return streak;

}


/* ==================================================
   RANKING
================================================== */

async function showRanking(){

  showOnly("ranking");

  const list =
    document.getElementById(
      "rankingList"
    );

  list.innerHTML =
    "⏳ Yuklanmoqda...";


  try{

    const response =
      await supabaseFetch(
        "results?select=telegram_id,username,first_name,iq,created_at&order=iq.desc&limit=1000"
      );


    if(!response.ok){

      list.innerHTML =
        "❌ Rankingni yuklab bo'lmadi.";

      return;

    }


    const data =
      await response.json();


    const users = {};


    data.forEach(row=>{

      const id =
        String(row.telegram_id);


      if(
        !users[id] ||
        row.iq > users[id].iq
      ){

        users[id] = row;

      }

    });


    const sorted =
      Object.values(users)
      .sort(
        (a,b)=>b.iq-a.iq
      )
      .slice(0,100);


    if(!sorted.length){

      list.innerHTML =
        "Hozircha natijalar yo'q.";

      return;

    }


    list.innerHTML = "";


    sorted.forEach(
      (user,index)=>{

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "rank-item";


        if(
          String(user.telegram_id) ===
          String(telegramId)
        ){

          div.classList.add(
            "my-rank"
          );

        }


        const name =
          user.first_name ||
          user.username ||
          "Guest";


        div.innerHTML = `

          <div class="rank-number">
            ${index+1}
          </div>

          <div class="rank-name">
            ${escapeHtml(name)}
          </div>

          <div class="rank-iq">
            IQ ${user.iq}
          </div>

        `;


        list.appendChild(
          div
        );

      }
    );


  }catch(error){

    console.log(error);

    list.innerHTML =
      "❌ Xatolik yuz berdi.";

  }

}

/* ==================================================
   HTML SECURITY
================================================== */

function escapeHtml(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
